<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Eco-Passport</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="Pass-con">
            <section class="Pass-Top">
                 <header>
                    <h1>PLANETARY ECO-PASSPORT</h1>
                    <p>Document Type: <strong>P (Passport)</strong> | Authority: <strong>Hack Club Embassy</strong></p>        
                </header>
                <div class="clearance-body">
                     <h2>Current Clearance Check</h2>
                     <p id="question-txt">Loading question...</p>
                     <div class="options-container" id="options-box"></div>
                </div>

            <section class="passport-page-btm">
                <h2>Visa & Achievements</h2>

                <div class="pass-data-spared">

                    <div class="stats-panel">
                        <p class="stats-label">TOTAL CARBONTRACKED</p>
                        <div class="score-readout"><span id="score-display">0</span> TCO<subscript>2</subscript></div>
                    </div>
                 

                    <div class="stamps-grid" id="stamps-log-box">

                    </div>
                </div>
            
            </section>
        </div>  

    <script src="app.js"></script>
    </body>
</html>
